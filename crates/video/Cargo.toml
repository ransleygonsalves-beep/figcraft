[package]
name = "figcraft-video"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FigCraft video: reading MP4 files (size, length, frames) and writing them, H.264 through Cisco's OpenH264 library downloaded at runtime"

[lints]
workspace = true

[dependencies]
# MP4 boxes, read and written (MIT).
mp4 = "0.14.0"
bytes = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# H.264: Cisco's own OpenH264 build, loaded at runtime (BSD-2-Clause bindings; the library is
# Cisco's binary, which carries its H.264 patent licence). Never compiled into FigCraft.
openh264 = { version = "0.9.10", default-features = false, features = ["libloading"] }
